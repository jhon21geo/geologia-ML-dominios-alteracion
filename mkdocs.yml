site_name: Tesis — Dominios de alteración con ML
site_description: Visor académico de la tesis. Delimitación de dominios de alteración hidrotermal mediante espectrometría SWIR–VNIR, geoquímica y aprendizaje automático.
site_author: Jhonatan Paul Mallma Espinoza
site_url: https://jhon21geo.github.io/geologia-ML-dominios-alteracion/
repo_url: https://github.com/jhon21geo/geologia-ML-dominios-alteracion
repo_name: jhon21geo/geologia-ML-dominios-alteracion
edit_uri: ""
copyright: Mallma Espinoza, J. P. (2026). FIGMM · Universidad Nacional de Ingeniería.
theme:
  name: material
  language: es
  logo: assets/uni-escudo-blanco-sm.png
  favicon: assets/favicon.png
  font:
    text: Source Serif 4
    code: IBM Plex Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: red
      accent: amber
      toggle:
        icon: material/weather-night
        name: Modo oscuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: red
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Modo claro
  features:
    - navigation.footer
    - navigation.instant
    - navigation.instant.progress
    - navigation.sections
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.tracking
    - navigation.path
    - search.suggest
    - search.highlight
    - toc.follow
    - content.tabs.link
    - content.tooltips

extra_css:
  - stylesheets/extra.css

nav:
  - Inicio: index.md
  - Leer la tesis:
    - Cómo leer este visor: guia.md
    - Resumen y abstract: 00-resumen.md
    - Introducción: 00b-introduccion-tesis.md
    - 1. Planteamiento: 01-introduccion.md
    - 2. Marco teórico: 02-marco-teorico.md
    - 3. Metodología: 02-metodologia.md
    - 3b. El geólogo asigna los dominios: 03-asignacion-dominios.md
    - 4. Espectro y geoquímica: 03-analisis-espectral.md
    - 5. Resultados de ML: 04-modelamiento-ml.md
    - 6. Conclusiones: 05-conclusiones.md
    - Referencias: 08-referencias.md
    - PDF (págs. 1–151): tesis-pdf.md
  - Probar el método:
    - Orange y Google Colab: 09-orange-colab.md
    - Replicar en Python: 06-replicacion.md
    - Opiniones y réplicas: 07-contribuciones.md

markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - md_in_html
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true
      toc_depth: 2

extra:
  social:
    - icon: fontawesome/solid/envelope
      link: mailto:jhonatangeo21@gmail.com
      name: Correo
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/geomin
      name: LinkedIn
    - icon: fontawesome/solid/building-columns
      link: https://www.uni.edu.pe/
      name: Universidad Nacional de Ingeniería
    - icon: fontawesome/brands/github
      link: https://github.com/jhon21geo/geologia-ML-dominios-alteracion
      name: GitHub
