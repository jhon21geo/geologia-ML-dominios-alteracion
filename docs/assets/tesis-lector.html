<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tesis — visor de lectura</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; }
    body { display: flex; flex-direction: column; background: #1b1b1b; color: #eee; }
    header {
      display: flex; gap: 0.5rem; align-items: center; justify-content: center;
      flex-wrap: wrap; padding: 0.45rem 0.7rem; background: #111; border-bottom: 1px solid #333;
      font-size: 0.9rem;
    }
    header button {
      background: #2a2a2a; color: #eee; border: 1px solid #555; border-radius: 6px;
      padding: 0.25rem 0.7rem; cursor: pointer;
    }
    header button:disabled { opacity: 0.4; cursor: default; }
    #page { min-width: 7rem; text-align: center; }
    main { flex: 1; overflow: auto; display: flex; justify-content: center; padding: 0.75rem; }
    canvas { max-width: 100%; height: auto; background: #fff; box-shadow: 0 0 24px #0008; }
    #status { padding: 2rem; color: #ccc; }
  </style>
</head>
<body>
  <header>
    <button type="button" id="prev" aria-label="Página anterior">Anterior</button>
    <span id="page">Cargando…</span>
    <button type="button" id="next" aria-label="Página siguiente">Siguiente</button>
    <button type="button" id="zoom-out" aria-label="Alejar">−</button>
    <button type="button" id="zoom-in" aria-label="Acercar">+</button>
  </header>
  <main>
    <div id="status">Abriendo la tesis en modo lectura…</div>
    <canvas id="page-canvas" hidden></canvas>
  </main>
  <script type="module">
    import * as pdfjsLib from "https://cdn.jsdelivr.net/npm/pdfjs-dist@4.6.82/build/pdf.min.mjs";

    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdn.jsdelivr.net/npm/pdfjs-dist@4.6.82/build/pdf.worker.min.mjs";

    const canvas = document.getElementById("page-canvas");
    const status = document.getElementById("status");
    const pageLabel = document.getElementById("page");
    const prevBtn = document.getElementById("prev");
    const nextBtn = document.getElementById("next");
    const pdfUrl = new URL("../Tesis.pdf", window.location.href).toString();

    let pdfDoc = null;
    let pageNum = 1;
    let scale = 1.25;

    async function renderPage(num) {
      const page = await pdfDoc.getPage(num);
      const viewport = page.getViewport({ scale });
      const ctx = canvas.getContext("2d");
      canvas.width = viewport.width;
      canvas.height = viewport.height;
      await page.render({ canvasContext: ctx, viewport }).promise;
      pageLabel.textContent = `${num} / ${pdfDoc.numPages}`;
      prevBtn.disabled = num <= 1;
      nextBtn.disabled = num >= pdfDoc.numPages;
    }

    try {
      pdfDoc = await pdfjsLib.getDocument({
        url: pdfUrl,
        disableRange: false,
        disableStream: false,
      }).promise;
      status.hidden = true;
      canvas.hidden = false;
      await renderPage(pageNum);
    } catch (err) {
      status.textContent = "No se pudo abrir el PDF en el visor. Recarga la página.";
      console.error(err);
    }

    prevBtn.addEventListener("click", () => {
      if (pageNum <= 1) return;
      pageNum -= 1;
      renderPage(pageNum);
    });
    nextBtn.addEventListener("click", () => {
      if (!pdfDoc || pageNum >= pdfDoc.numPages) return;
      pageNum += 1;
      renderPage(pageNum);
    });
    document.getElementById("zoom-in").addEventListener("click", () => {
      scale = Math.min(scale + 0.2, 3);
      renderPage(pageNum);
    });
    document.getElementById("zoom-out").addEventListener("click", () => {
      scale = Math.max(scale - 0.2, 0.6);
      renderPage(pageNum);
    });
    document.addEventListener("keydown", (event) => {
      if (event.key === "ArrowRight" || event.key === "PageDown") nextBtn.click();
      if (event.key === "ArrowLeft" || event.key === "PageUp") prevBtn.click();
    });
  </script>
</body>
</html>
