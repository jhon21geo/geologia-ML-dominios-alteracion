name: Error
description: Reporta un fallo reproducible del código o la documentación.
title: "[bug] "
labels: ["bug"]
body:
  - type: textarea
    id: esperado
    attributes:
      label: Comportamiento esperado
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Comportamiento actual
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Cómo reproducirlo
      placeholder: "python -m alteration_ml.cli run --profile thesis"
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Python / SO
