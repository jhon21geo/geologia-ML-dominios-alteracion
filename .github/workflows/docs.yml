name: Docs
on:
  push:
    branches: [main, "cursor/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar MkDocs
        run: pip install mkdocs mkdocs-material
      - name: Construir sitio
        run: mkdocs build --strict
      - name: Publicar en gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          user_name: jhon21geo
          user_email: 101995705+jhon21geo@users.noreply.github.com

